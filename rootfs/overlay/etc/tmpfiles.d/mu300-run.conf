# The daemons' directories in /run, made by root at boot before anybody else can take the names (/run is mounted
# 1777 on these images; mu300-atd checks and recovers on its own as well: /opt/mu300/lib/run-dir.sh, which the
# audio extra's mu300-voice uses the same way for its own /run/mu300-voice).
d /run/mu300-at 0755 root root -
