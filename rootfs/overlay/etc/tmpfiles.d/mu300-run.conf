# The daemons' directories in /run, made by root at boot before anybody else can take the names (/run is mounted
# 1777 on these images; mu300-atd and mu300-voice check and recover on their own as well: /opt/mu300/lib/run-dir.sh).
d /run/mu300-at 0755 root root -
d /run/mu300-voice 0700 root root -
