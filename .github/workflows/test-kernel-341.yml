name: Test kernel with #341

# Builds only the mainline kernel (7.2) from this branch and packs it as a kernel bundle,
# so the TCA/redriver change of PR #341 can be tried on a device.
on:
  workflow_dispatch:
    inputs:
      kv:
        description: 'Kernel version (empty: 7.2.11)'
        required: false
        default: '7.2.11'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Build environment
        run: docker build -t mu300-mainline-build upstream/

      - name: Kernel
        env:
          KV: ${{ inputs.kv }}
          OUTDIR: out-7.2
        run: |
          docker volume create mu300-mainline
          docker run --rm -e KV -e OUTDIR \
            -v mu300-mainline:/src -v "$PWD/upstream":/work \
            mu300-mainline-build bash /work/build.sh

      - name: Modules
        env:
          KV: ${{ inputs.kv }}
          OUTDIR: out-7.2
        run: |
          docker run --rm -e KV -e OUTDIR \
            -v mu300-mainline:/src -v "$PWD/upstream":/work \
            mu300-mainline-build bash /work/build-modules.sh

      - name: Reference 5.4 bundle (e2fsck, busybox, logdw)
        run: |
          mkdir -p /tmp/ref
          curl -fsSL -o /tmp/ref/mu300-kernel.tar.gz \
            https://github.com/dikeckaan/mu300-linux/releases/latest/download/mu300-kernel.tar.gz
          ls -l /tmp/ref

      - name: Bundle
        env:
          KV: ${{ inputs.kv }}
        run: |
          MU300_UPSTREAM_OUT=upstream/out-7.2 \
            sh upstream/make-bundle.sh "/tmp/mu300-kernel-${KV}-341.tar.gz" /tmp/ref/mu300-kernel.tar.gz
          ls -lh /tmp/mu300-kernel-*.tar.gz

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: mu300-kernel-341
          path: /tmp/mu300-kernel-*-341.tar.gz
          retention-days: 7

      - name: Build logs on failure
        if: failure()
        run: tail -n 80 upstream/out-7.2/modules/*.log 2>/dev/null || true
