<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9ece8"/>
      <stop offset="1" stop-color="#a6d5d0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2328"/>
      <stop offset="1" stop-color="#0a0e12"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0b1b1f" flood-opacity="0.18"/>
    </filter>
    <filter id="card" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0b1b1f" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b72"/>
    </marker>
  </defs>

  <rect width="900" height="480" rx="26" fill="#f5f8fa"/>
  <rect x="1" y="1" width="898" height="478" rx="25" fill="none" stroke="#e3e9ee"/>

  <!-- device -->
  <g filter="url(#soft)">
    <rect x="78" y="66" width="252" height="348" rx="34" fill="url(#body)" stroke="#8fc2bd" stroke-width="2"/>
    <rect x="96" y="86" width="216" height="308" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.45"/>
  </g>

  <!-- 5G badge -->
  <circle cx="126" cy="112" r="18" fill="#e60012"/>
  <text x="126" y="117" text-anchor="middle" font-family="Inter, -apple-system, 'PingFang SC', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">5G</text>

  <!-- ring display -->
  <circle cx="204" cy="244" r="112" fill="url(#ring)"/>
  <circle cx="204" cy="244" r="104" fill="none" stroke="#2a363d" stroke-width="1"/>
  <circle cx="204" cy="244" r="86" fill="#c3e6e2"/>
  <circle cx="204" cy="244" r="86" fill="none" stroke="#ffffff" stroke-opacity="0.5"/>

  <!-- NFC mark -->
  <g stroke="#123035" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M190 262 L190 226"/>
    <path d="M190 226 L218 262"/>
    <path d="M218 262 L218 226"/>
  </g>

  <!-- battery icon (top right of ring) -->
  <g transform="translate(282,164)" fill="#e9f2f4">
    <rect x="0" y="0" width="27" height="15" rx="4"/>
    <rect x="29" y="4" width="3.5" height="7" rx="1.5"/>
    <rect x="5" y="4.5" width="4" height="6" rx="1.2" fill="#16232a"/>
    <rect x="11" y="4.5" width="4" height="6" rx="1.2" fill="#16232a"/>
    <rect x="17" y="4.5" width="4" height="6" rx="1.2" fill="#16232a"/>
  </g>

  <!-- signal icon (bottom right of ring) -->
  <g transform="translate(282,300)" fill="#e9f2f4">
    <rect x="0" y="12" width="4.5" height="7" rx="1.6"/>
    <rect x="7.5" y="8" width="4.5" height="11" rx="1.6"/>
    <rect x="15" y="4" width="4.5" height="15" rx="1.6"/>
    <rect x="22.5" y="0" width="4.5" height="19" rx="1.6"/>
  </g>

  <!-- Wi-Fi icon on the ring: on -->
  <g transform="translate(287,231)" stroke="#57b0ff" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M1 8 A 20 20 0 0 1 29 8"/>
    <path d="M7 15 A 12 12 0 0 1 23 15"/>
    <circle cx="16" cy="21.5" r="2.4" fill="#57b0ff" stroke="none"/>
  </g>
  <circle cx="303" cy="240" r="22" fill="#57b0ff" fill-opacity="0.12"/>

  <!-- side key -->
  <g>
    <rect x="330" y="212" width="11" height="58" rx="5.5" fill="#98a7ad" stroke="#7c8b91" stroke-width="1.5"/>
    <rect x="333" y="220" width="5" height="42" rx="2.5" fill="#b9c6cb"/>
  </g>

  <!-- arrow from the key to the card -->
  <path d="M352 241 C 395 241, 420 241, 462 241" fill="none" stroke="#5b6b72" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="405" y="226" text-anchor="middle" font-family="Inter, -apple-system, 'PingFang SC', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#40515a">3 s hold</text>

  <!-- card -->
  <g filter="url(#card)">
    <rect x="470" y="112" width="360" height="266" rx="20" fill="#ffffff" stroke="#dde5ea"/>
  </g>
  <text x="494" y="146" font-family="Inter, -apple-system, 'PingFang SC', Arial, sans-serif" font-size="15" font-weight="700" fill="#22343c">Wi-Fi key · 长按 3 秒</text>
  <text x="494" y="167" font-family="Inter, -apple-system, 'PingFang SC', Arial, sans-serif" font-size="11.5" fill="#72848d">one hold wakes the device and toggles the hotspot</text>

  <!-- ON row -->
  <rect x="494" y="196" width="74" height="38" rx="19" fill="#27ae60"/>
  <circle cx="549" cy="215" r="14.5" fill="#ffffff"/>
  <g transform="translate(592,203)" stroke="#57b0ff" stroke-width="2.6" fill="none" stroke-linecap="round">
    <path d="M1 8 A 18 18 0 0 1 27 8"/>
    <path d="M6 14 A 11 11 0 0 1 22 14"/>
    <circle cx="14" cy="20" r="2.2" fill="#57b0ff" stroke="none"/>
  </g>
  <text x="630" y="215" font-family="Inter, -apple-system, 'PingFang SC', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#22343c">Wi-Fi ON</text>
  <text x="630" y="232" font-family="Inter, -apple-system, 'PingFang SC', Arial, sans-serif" font-size="11" fill="#72848d">热点开 · 单独使用时</text>

  <!-- OFF row -->
  <rect x="494" y="286" width="74" height="38" rx="19" fill="#d6dee3"/>
  <circle cx="513" cy="305" r="14.5" fill="#ffffff"/>
  <g transform="translate(592,293)" stroke="#9aa9b1" stroke-width="2.6" fill="none" stroke-linecap="round">
    <path d="M1 8 A 18 18 0 0 1 27 8"/>
    <path d="M6 14 A 11 11 0 0 1 22 14"/>
    <circle cx="14" cy="20" r="2.2" fill="#9aa9b1" stroke="none"/>
  </g>
  <text x="630" y="305" font-family="Inter, -apple-system, 'PingFang SC', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#22343c">Wi-Fi OFF</text>
  <text x="630" y="322" font-family="Inter, -apple-system, 'PingFang SC', Arial, sans-serif" font-size="11" fill="#72848d">热点关 · 接 USB 路由器时</text>

  <!-- footer -->
  <text x="450" y="446" text-anchor="middle" font-family="Inter, -apple-system, 'PingFang SC', Arial, sans-serif" font-size="12" fill="#6b7c85">短按：2.4G ↔ 5G　|　长按 3 秒：热点开 / 关（休眠时一次长按即唤醒并切换）　|　接 USB 路由器时关掉热点降温</text>
</svg>
